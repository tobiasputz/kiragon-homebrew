name: Test and publish Foundry module
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: |
          for f in scripts/*.mjs tests/*.mjs; do node --check "$f"; done
          node --test tests/*.test.mjs
      - name: Package Foundry release
        run: python3 tools/build_release.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/module.json dist/kiragon-homebrew.zip \
            --title "Kiragon Homebrew $GITHUB_REF_NAME" --generate-notes
